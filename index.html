<script>

/* ==========================================================
CẤU HÌNH GITHUB
========================================================== */

const GITHUB_USER   = "khanhitpro";
const GITHUB_REPO   = "KHANH_IT";
const GITHUB_BRANCH = "main";
const GITHUB_FOLDER = "DATA";

/*
    Git Trees API:
    recursive=1 = quét toàn bộ thư mục + thư mục con
*/
const API_URL =
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;


/* ==========================================================
BIẾN
========================================================== */

let allFiles = [];


/* ==========================================================
LOAD TOÀN BỘ FILE
========================================================== */

async function loadFiles(){

    const grid =
        document.getElementById("grid");

    const status =
        document.getElementById("statusText");


    try{

        status.innerText =
            "Đang quét toàn bộ kho dữ liệu...";


        const response = await fetch(
            API_URL + "&t=" + Date.now(),
            {
                cache:"no-store"
            }
        );


        if(!response.ok){

            throw new Error(
                "GitHub API lỗi: " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
        =====================================================
        CHỈ LẤY FILE TRONG DATA
        =====================================================

        blob = file

        Ví dụ:

        DATA/app.exe

        DATA/APK/app.apk

        DATA/TOOL/XIAOMI/tool.zip

        đều được lấy.
        */

        allFiles = data.tree.filter(item =>

            item.type === "blob"

            &&

            item.path.startsWith(
                GITHUB_FOLDER + "/"
            )

        );


        /*
        Thêm thông tin tên file
        */

        allFiles = allFiles.map(file => {

            const parts =
                file.path.split("/");

            return {

                ...file,

                name:
                    parts[
                        parts.length - 1
                    ],

                folder:
                    getFolder(file.path)

            };

        });


        /*
        Sắp xếp theo tên
        */

        allFiles.sort((a,b) =>

            a.name.localeCompare(
                b.name,
                "vi",
                {
                    numeric:true
                }
            )

        );


        renderFiles(allFiles);


        status.innerText =

            `Đã đồng bộ ${allFiles.length} file • ` +

            new Date().toLocaleTimeString(
                "vi-VN"
            );


    }
    catch(error){

        console.error(error);


        status.innerText =
            "Không thể kết nối GitHub";


        grid.innerHTML = `

            <div class="error">

                ❌ Không thể tải dữ liệu GitHub

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Hãy thử tải lại trang.

            </div>

        `;

    }

}


/* ==========================================================
LẤY TÊN THƯ MỤC
========================================================== */

function getFolder(path){

    const parts =
        path.split("/");


    /*
    Xóa tên file
    */

    parts.pop();


    /*
    Xóa DATA
    */

    if(
        parts.length > 0
        &&
        parts[0] === GITHUB_FOLDER
    ){

        parts.shift();

    }


    /*
    File nằm trực tiếp DATA
    */

    if(parts.length === 0){

        return "DATA";

    }


    return parts.join(" / ");

}


/* ==========================================================
HIỂN THỊ FILE
========================================================== */

function renderFiles(files){

    const grid =
        document.getElementById("grid");


    grid.innerHTML = "";


    if(files.length === 0){

        grid.innerHTML = `

            <div class="empty">

                🔎 Không tìm thấy file.

            </div>

        `;

        return;

    }


    files.forEach(file => {


        const card =
            document.createElement("div");


        card.className =
            "card";


        const ext =
            getExtension(
                file.name
            );


        const icon =
            getIcon(ext);


        /*
        =====================================================
        LINK RAW TẢI TRỰC TIẾP
        =====================================================
        */

        const downloadURL =

            `https://raw.githubusercontent.com/` +

            `${GITHUB_USER}/` +

            `${GITHUB_REPO}/` +

            `${GITHUB_BRANCH}/` +

            `${encodeGitHubPath(file.path)}`;


        card.innerHTML = `

            <div class="file-icon">

                ${icon}

            </div>


            <div class="file-name">

                ${escapeHTML(file.name)}

            </div>


            <div class="file-info">

                ${ext.toUpperCase() || "FILE"}

                •

                ${formatSize(file.size || 0)}

            </div>


            <div style="
                font-size:12px;
                color:#38bdf8;
                margin-bottom:14px;
                word-break:break-word;
            ">

                📂 ${escapeHTML(file.folder)}

            </div>


            <a
                class="download-btn"
                href="${downloadURL}"
                download
            >

                ⬇ TẢI NGAY

            </a>

        `;


        grid.appendChild(card);

    });

}


/* ==========================================================
TÌM KIẾM
========================================================== */

function searchFiles(){

    const keyword =

        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    /*
    Không nhập gì
    */

    if(!keyword){

        renderFiles(allFiles);

        return;

    }


    /*
    Tìm theo:

    - tên file
    - tên thư mục
    - đường dẫn
    */

    const result =
        allFiles.filter(file =>

            file.name
                .toLowerCase()
                .includes(keyword)

            ||

            file.folder
                .toLowerCase()
                .includes(keyword)

            ||

            file.path
                .toLowerCase()
                .includes(keyword)

        );


    renderFiles(result);

}


/* ==========================================================
LẤY ĐUÔI FILE
========================================================== */

function getExtension(name){

    if(!name.includes(".")){

        return "";

    }


    return name
        .split(".")
        .pop()
        .toLowerCase();

}


/* ==========================================================
ICON THEO FILE
========================================================== */

function getIcon(ext){

    switch(ext){


        /* FILE NÉN */

        case "zip":
        case "rar":
        case "7z":

            return "📦";


        /* ANDROID */

        case "apk":
        case "xapk":
        case "apks":

            return "📱";


        /* WINDOWS */

        case "exe":
        case "msi":

            return "💻";


        /* PYTHON */

        case "py":
        case "pyc":

            return "🐍";


        /* WINDOWS SCRIPT */

        case "bat":
        case "cmd":
        case "ps1":

            return "⚙️";


        /* SHELL */

        case "sh":

            return "🖥️";


        /* PDF */

        case "pdf":

            return "📕";


        /* TEXT */

        case "txt":
        case "json":
        case "xml":

            return "📄";


        /* IMAGE */

        case "jpg":
        case "jpeg":
        case "png":
        case "webp":
        case "gif":

            return "🖼️";


        /* VIDEO */

        case "mp4":
        case "mkv":
        case "avi":

            return "🎬";


        /* AUDIO */

        case "mp3":
        case "wav":
        case "flac":

            return "🎵";


        default:

            return "📁";

    }

}


/* ==========================================================
HIỂN THỊ DUNG LƯỢNG
========================================================== */

function formatSize(bytes){

    if(!bytes){

        return "0 B";

    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    const i = Math.floor(

        Math.log(bytes) /
        Math.log(1024)

    );


    return (

        bytes /
        Math.pow(1024,i)

    ).toFixed(2)

    + " "

    + units[i];

}


/* ==========================================================
ENCODE LINK GITHUB
========================================================== */

function encodeGitHubPath(path){

    return path

        .split("/")

        .map(
            part =>
                encodeURIComponent(part)
        )

        .join("/");

}


/* ==========================================================
CHỐNG HTML INJECTION
========================================================== */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================================
KHỞI ĐỘNG
========================================================== */

window.addEventListener(
    "load",
    loadFiles
);


/* ==========================================================
TỰ ĐỘNG CẬP NHẬT MỖI 60 GIÂY
========================================================== */

setInterval(
    loadFiles,
    60000
);

</script>
