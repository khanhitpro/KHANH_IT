<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KHÁNH IT STORE</title>

<link rel="icon"
type="image/x-icon"
href="https://raw.githubusercontent.com/khanhitpro/KHANH_IT/main/logo.ico">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:#050b14;
    padding-bottom:65px;
}

/* NỀN */
.overlay{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top,#0c4a6e55,transparent 45%),
        linear-gradient(#050b14ee,#020617ee);
    z-index:-1;
}

/* ==============================
TOP
============================== */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 20px;
    background:rgba(15,23,42,.92);
    border-bottom:1px solid rgba(56,189,248,.25);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(10px);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:38px;
    height:38px;
    border-radius:8px;
}

.logo b{
    color:#38bdf8;
}

/* ==============================
HERO
============================== */

.hero{
    text-align:center;
    padding:30px 15px 10px;
}

.hero h1{
    margin:0;
    font-size:32px;
    color:#38bdf8;
}

.hero p{
    color:#94a3b8;
}

/* ==============================
STATUS
============================== */

.status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    color:#94a3b8;
    font-size:14px;
    margin:10px;
}

.status-dot{
    width:9px;
    height:9px;
    background:#22c55e;
    border-radius:50%;
    box-shadow:0 0 10px #22c55e;
}

/* ==============================
SEARCH
============================== */

.search{
    max-width:700px;
    width:90%;
    margin:20px auto;
}

.search input{
    width:100%;
    padding:14px 18px;
    border:none;
    outline:none;
    border-radius:15px;
    color:white;
    background:#0f172a;
    border:1px solid rgba(56,189,248,.25);
    font-size:15px;
}

.search input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 15px rgba(56,189,248,.25);
}

/* ==============================
THỐNG KÊ
============================== */

.stats{
    text-align:center;
    color:#64748b;
    font-size:13px;
    margin-bottom:10px;
}

/* ==============================
GRID
============================== */

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));

    gap:16px;
    padding:20px;
    max-width:1500px;
    margin:auto;
}

/* ==============================
CARD
============================== */

.card{
    background:
        linear-gradient(
            145deg,
            rgba(30,41,59,.82),
            rgba(15,23,42,.95)
        );

    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    padding:18px;
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-5px);
    border-color:rgba(56,189,248,.5);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* icon */

.file-icon{
    font-size:40px;
    margin-bottom:12px;
}

/* tên */

.file-name{
    font-size:16px;
    font-weight:bold;
    color:#f8fafc;
    word-break:break-word;
    min-height:42px;
}

/* info */

.file-info{
    color:#94a3b8;
    font-size:13px;
    margin-top:10px;
}

/* thư mục */

.folder{
    color:#38bdf8;
    font-size:12px;
    margin-top:8px;
    margin-bottom:15px;
    word-break:break-word;
}

/* ==============================
BUTTON
============================== */

.download-btn{
    display:block;
    width:100%;
    text-decoration:none;
    text-align:center;
    color:white;
    font-weight:bold;
    padding:12px;
    border-radius:13px;

    background:
        linear-gradient(
            90deg,
            #38bdf8,
            #0ea5e9,
            #2563eb
        );

    box-shadow:
        0 0 12px rgba(56,189,248,.35);

    transition:.25s;
}

.download-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 22px rgba(56,189,248,.7);
}

/* ==============================
LOADING / ERROR
============================== */

.loading,
.error,
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
}

.loading{
    color:#38bdf8;
}

.error{
    color:#f87171;
}

.empty{
    color:#94a3b8;
}

/* ==============================
MARQUEE
============================== */

.marquee{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#020617;
    padding:11px 0;
    overflow:hidden;
    z-index:999;
    border-top:1px solid rgba(56,189,248,.3);
}

.marquee div{
    white-space:nowrap;
    display:inline-block;
    padding-left:100%;
    animation:run 28s linear infinite;
    color:#38bdf8;
    font-weight:bold;
}

@keyframes run{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

/* ==============================
MOBILE
============================== */

@media(max-width:600px){

    .hero h1{
        font-size:24px;
    }

    .grid{
        grid-template-columns:1fr;
        padding:12px;
    }

}

</style>

</head>

<body>

<div class="overlay"></div>


<!-- ===========================
TOP
=========================== -->

<div class="topbar">

    <div class="logo">

        <img
        src="https://raw.githubusercontent.com/khanhitpro/KHANH_IT/main/logo.ico"
        onerror="this.style.display='none'">

        <b>KHÁNH IT STORE</b>

    </div>

</div>


<!-- ===========================
HERO
=========================== -->

<div class="hero">

    <h1>KHÁNH IT DOWNLOAD CENTER</h1>

    <p>
        Kho phần mềm • APK • Tool • Python
        được cập nhật tự động
    </p>

</div>


<!-- ===========================
STATUS
=========================== -->

<div class="status">

    <span class="status-dot"></span>

    <span id="statusText">
        Đang kết nối GitHub...
    </span>

</div>


<!-- ===========================
SEARCH
=========================== -->

<div class="search">

    <input
        id="searchInput"
        type="text"
        placeholder="🔎 Tìm kiếm tên file hoặc thư mục..."
    >

</div>


<div
    class="stats"
    id="stats">
</div>


<!-- ===========================
GRID
=========================== -->

<div
    class="grid"
    id="grid">

    <div class="loading">

        ⏳ Đang đọc dữ liệu GitHub...

    </div>

</div>


<!-- ===========================
MARQUEE
=========================== -->

<div class="marquee">

    <div>

        🔥 KHÁNH IT STORE •
        PC TOOL •
        ANDROID TOOL •
        XIAOMI TV •
        APK •
        PYTHON •
        DỮ LIỆU CẬP NHẬT TỰ ĐỘNG TỪ GITHUB

    </div>

</div>


<script>

/* ==========================================================
CẤU HÌNH
========================================================== */

const USER   = "khanhitpro";
const REPO   = "KHANH_IT";
const BRANCH = "main";
const ROOT   = "DATA";


/*
Git Trees API.

recursive=1
=> lấy toàn bộ cây repo chỉ bằng 1 request.
*/

const API =
    "https://api.github.com/repos/"
    + USER
    + "/"
    + REPO
    + "/git/trees/"
    + BRANCH
    + "?recursive=1";


let allFiles = [];


/* ==========================================================
ELEMENT
========================================================== */

const grid =
    document.getElementById("grid");

const statusText =
    document.getElementById("statusText");

const stats =
    document.getElementById("stats");

const searchInput =
    document.getElementById("searchInput");


/* ==========================================================
LOAD GITHUB
========================================================== */

async function loadFiles(){

    try{

        statusText.innerText =
            "Đang kiểm tra GitHub...";


        const response =
            await fetch(
                API,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        /*
        Đề phòng API trả dữ liệu bất thường
        */

        if(
            !data
            ||
            !Array.isArray(data.tree)
        ){

            throw new Error(
                "GitHub không trả về danh sách file."
            );

        }


        /*
        ================================================
        LẤY TẤT CẢ FILE TRONG DATA
        ================================================

        blob = file

        DATA/a.zip                OK
        DATA/ABC/a.exe            OK
        DATA/A/B/C/test.apk       OK

        folder sẽ không hiện thành file.
        */

        const files =
            data.tree.filter(item => {

                return (

                    item.type === "blob"

                    &&

                    item.path

                    &&

                    item.path.startsWith(
                        ROOT + "/"
                    )

                );

            });


        /*
        Chuyển thành dữ liệu dùng cho website.
        */

        allFiles =
            files.map(item => {

                const parts =
                    item.path.split("/");


                const fileName =
                    parts[
                        parts.length - 1
                    ];


                const folderParts =
                    parts.slice(
                        1,
                        -1
                    );


                return {

                    name:fileName,

                    path:item.path,

                    size:item.size || 0,

                    folder:
                        folderParts.length
                        ?
                        folderParts.join(" / ")
                        :
                        ROOT

                };

            });


        /*
        ================================================
        SẮP XẾP
        ================================================

        Tên gần giống:
        V2
        V3
        V10

        sẽ sắp số tự nhiên.
        */

        allFiles.sort((a,b) =>

            a.name.localeCompare(
                b.name,
                "vi",
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )

        );


        render(allFiles);


        const now =
            new Date()
            .toLocaleTimeString(
                "vi-VN"
            );


        statusText.innerText =
            "Đồng bộ thành công • "
            + now;


        stats.innerText =
            "📦 Tổng cộng "
            + allFiles.length
            + " file";


        /*
        Nếu GitHub nói tree bị truncated
        thì cảnh báo.
        */

        if(data.truncated === true){

            statusText.innerText +=
                " • GitHub giới hạn danh sách";

        }


    }
    catch(error){

        console.error(
            "KHANH IT GitHub Error:",
            error
        );


        statusText.innerText =
            "Lỗi kết nối GitHub";


        stats.innerText = "";


        grid.innerHTML = `

            <div class="error">

                ❌ Không thể tải danh sách file.

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                <button
                    onclick="loadFiles()"
                    style="
                        padding:12px 25px;
                        cursor:pointer;
                        border:0;
                        border-radius:10px;
                    "
                >

                    🔄 THỬ LẠI

                </button>

            </div>

        `;

    }

}


/* ==========================================================
RENDER
========================================================== */

function render(files){

    grid.innerHTML = "";


    if(files.length === 0){

        grid.innerHTML = `

            <div class="empty">

                🔎 Không tìm thấy file.

            </div>

        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    files.forEach(file => {


        const card =
            document.createElement("div");


        card.className =
            "card";


        const ext =
            getExtension(
                file.name
            );


        const icon =
            getIcon(ext);


        /*
        Link RAW tải trực tiếp.
        */

        const downloadURL =

            "https://raw.githubusercontent.com/"
            + USER
            + "/"
            + REPO
            + "/"
            + BRANCH
            + "/"
            + encodePath(file.path);


        card.innerHTML = `

            <div class="file-icon">

                ${icon}

            </div>


            <div class="file-name">

                ${escapeHTML(file.name)}

            </div>


            <div class="file-info">

                ${escapeHTML(
                    ext
                    ?
                    ext.toUpperCase()
                    :
                    "FILE"
                )}

                •

                ${formatSize(file.size)}

            </div>


            <div class="folder">

                📂 ${escapeHTML(file.folder)}

            </div>


            <a
                class="download-btn"
                href="${downloadURL}"
                target="_blank"
                rel="noopener noreferrer"
            >

                ⬇ TẢI NGAY

            </a>

        `;


        fragment.appendChild(card);

    });


    grid.appendChild(fragment);

}


/* ==========================================================
SEARCH
========================================================== */

searchInput.addEventListener(
    "input",
    function(){

        const keyword =
            this.value
            .trim()
            .toLowerCase();


        if(!keyword){

            render(allFiles);

            stats.innerText =
                "📦 Tổng cộng "
                + allFiles.length
                + " file";

            return;

        }


        const result =
            allFiles.filter(file => {

                return (

                    file.name
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    file.folder
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    file.path
                    .toLowerCase()
                    .includes(keyword)

                );

            });


        render(result);


        stats.innerText =
            "🔎 Tìm thấy "
            + result.length
            + " / "
            + allFiles.length
            + " file";

    }
);


/* ==========================================================
EXTENSION
========================================================== */

function getExtension(name){

    const pos =
        name.lastIndexOf(".");


    if(
        pos === -1
        ||
        pos === name.length - 1
    ){

        return "";

    }


    return name
        .substring(pos + 1)
        .toLowerCase();

}


/* ==========================================================
ICON
========================================================== */

function getIcon(ext){

    const icons = {

        apk:"📱",
        xapk:"📱",
        apks:"📱",

        exe:"💻",
        msi:"💻",

        zip:"📦",
        rar:"📦",
        "7z":"📦",

        py:"🐍",
        pyc:"🐍",

        bat:"⚙️",
        cmd:"⚙️",
        ps1:"⚙️",
        sh:"⚙️",

        pdf:"📕",

        txt:"📄",
        json:"📄",
        xml:"📄",

        png:"🖼️",
        jpg:"🖼️",
        jpeg:"🖼️",
        webp:"🖼️",

        mp3:"🎵",
        wav:"🎵",

        mp4:"🎬",
        mkv:"🎬"

    };


    return icons[ext] || "📄";

}


/* ==========================================================
SIZE
========================================================== */

function formatSize(bytes){

    if(
        bytes === undefined
        ||
        bytes === null
        ||
        bytes <= 0
    ){

        return "0 B";

    }


    const units =
        [
            "B",
            "KB",
            "MB",
            "GB",
            "TB"
        ];


    let value = bytes;

    let index = 0;


    while(
        value >= 1024
        &&
        index < units.length - 1
    ){

        value /= 1024;

        index++;

    }


    return value.toFixed(
        index === 0 ? 0 : 2
    )
    +
    " "
    +
    units[index];

}


/* ==========================================================
ENCODE PATH
========================================================== */

function encodePath(path){

    return path
        .split("/")
        .map(
            part =>
                encodeURIComponent(part)
        )
        .join("/");

}


/* ==========================================================
SECURITY
========================================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================================
START
========================================================== */

loadFiles();


/*
Tự kiểm tra lại GitHub sau mỗi 60 giây.
*/

setInterval(
    loadFiles,
    60000
);

</script>

</body>
</html>
